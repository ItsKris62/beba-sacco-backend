databases:
  - name: beba-postgres
    databaseName: beba
    user: beba
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: redis
    name: beba-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: beba-api
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate --schema=src/prisma/schema.prisma && npm run build
    preDeployCommand: npx prisma migrate deploy --schema=src/prisma/schema.prisma
    startCommand: node dist/main
    healthCheckPath: /api/health/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      # beba-worker (below) already runs every BullMQ processor. Without this,
      # the web service also registers them as a "local fallback," doubling
      # every queue's Redis connections and exhausting beba-redis's connection
      # limit on boot (ECONNRESET storm / deploy timeout).
      - key: HAS_DEDICATED_WORKER
        value: "true"
      - key: APP_URL
        value: https://your-production-frontend-domain.com
      - key: FRONTEND_URL
        value: https://your-production-frontend-domain.com
      - key: CORS_ORIGIN
        value: https://your-production-frontend-domain.com
      - key: DATABASE_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: beba-redis
          property: connectionString
      - key: BULL_REDIS_URL
        fromService:
          type: redis
          name: beba-redis
          property: connectionString
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: SWAGGER_USER
        sync: false
      - key: SWAGGER_PASSWORD
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_SENDER_ID
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_B2C_SHORTCODE
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_B2C_RESULT_URL
        sync: false
      - key: MPESA_B2C_QUEUE_TIMEOUT_URL
        sync: false
      - key: MPESA_WEBHOOK_SECRET
        sync: false
      - key: MPESA_ALLOWED_IPS
        sync: false
      - key: MPESA_STK_RATE_LIMIT_PER_DAY
        value: "3"
      - key: PLUNK_API_KEY
        sync: false
      - key: PLUNK_SECRET_KEY
        sync: false
      - key: PLUNK_FROM_EMAIL
        sync: false
      - key: PLUNK_FROM_NAME
        value: Beba SACCO
      - key: ENABLE_PRODUCT_RULES
        value: "true"
      - key: FEATURE_EMAIL_VERIFICATION_ENFORCED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: TINYBIRD_TOKEN
        sync: false
      - key: TINYBIRD_API_URL
        value: https://api.europe-west2.gcp.tinybird.co
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: DATA_RETENTION_YEARS
        value: "7"
      - key: BULLMQ_CONCURRENCY_ACCRUAL
        value: "3"
      - key: BULLMQ_CONCURRENCY_RECON
        value: "2"
      - key: BULLMQ_CONCURRENCY_LEDGER
        value: "2"
      - key: BULLMQ_CONCURRENCY_WEBHOOK
        value: "10"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: PAGERDUTY_INTEGRATION_KEY
        sync: false

  - type: worker
    name: beba-worker
    # CRITICAL: keep BullMQ processors in this separate worker service.
    # Do not run queue processors inside the web service; web traffic must not starve jobs.
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate --schema=src/prisma/schema.prisma && npm run build
    startCommand: node dist/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: beba-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: beba-redis
          property: connectionString
      - key: BULL_REDIS_URL
        fromService:
          type: redis
          name: beba-redis
          property: connectionString
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_SENDER_ID
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_B2C_SHORTCODE
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_B2C_RESULT_URL
        sync: false
      - key: MPESA_B2C_QUEUE_TIMEOUT_URL
        sync: false
      - key: MPESA_WEBHOOK_SECRET
        sync: false
      - key: MPESA_ALLOWED_IPS
        sync: false
      - key: PLUNK_API_KEY
        sync: false
      - key: PLUNK_SECRET_KEY
        sync: false
      - key: PLUNK_FROM_EMAIL
        sync: false
      - key: PLUNK_FROM_NAME
        value: Beba SACCO
      - key: ENABLE_PRODUCT_RULES
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: TINYBIRD_TOKEN
        sync: false
      - key: AUDIT_HMAC_SECRET
        sync: false
      - key: BULLMQ_CONCURRENCY_ACCRUAL
        value: "3"
      - key: BULLMQ_CONCURRENCY_RECON
        value: "2"
      - key: BULLMQ_CONCURRENCY_LEDGER
        value: "2"
      - key: BULLMQ_CONCURRENCY_WEBHOOK
        value: "10"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: PAGERDUTY_INTEGRATION_KEY
        sync: false

